name: catty-reminders

services:
  db:
    image: mariadb:11
    container_name: ${DB_CONTAINER_NAME:-catty-db}
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${HOST_DB_PORT:-3306}:${CONTAINER_DB_PORT:-3306}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - catty-network

  catty-app:
    image: ${IMAGE}
    container_name: ${APP_CONTAINER_NAME:-catty-app}
    restart: always
    environment:
      DEPLOY_REF: ${DEPLOY_REF}
    ports:
      - "${HOST_APP_PORT:-8181}:${CONTAINER_APP_PORT:-8181}"
    volumes:
      - ./config.json:/catty-reminders-app/config.json:ro   # монтируем конфиг
    depends_on:
      - db
    networks:
      - catty-network

networks:
  catty-network:
    driver: bridge

volumes:
  db_data:
