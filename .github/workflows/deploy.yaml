name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: hesa
          port: 3113
          key: ${{ secrets.SSH_LAB2 }}
          script: |
            set -e
            cd /home/hesa/catty-reminders-app
            git fetch origin
            git checkout lab4
            git pull origin lab4

            export DEPLOY_REF="${{ github.sha }}"
            export IMAGE="ghcr.io/kilopevt/catty-reminders-app:${{ github.sha }}"
            export APP_CONTAINER_NAME="catty-app"
            export MARIADB_ROOT_PASSWORD="mypass"
            export MARIADB_USER="hesa"
            export MARIADB_PASSWORD="mypass"
            export MARIADB_DATABASE="catty_reminders"
            export HOST_DB_PORT=3306
            export HOST_APP_PORT=8181

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u kilopevt --password-stdin
            docker compose up -d --pull always --remove-orphans --force-recreate
