name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Image Name
        id: prep
        run: echo "repo_lower=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_OUTPUT}
      - name: Remote Docker Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: hesa
          key: ${{ secrets.SSH_LAB2 }}
          port: 3113
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE="ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest"
            CONTAINER_NAME="catty-container"
            docker pull $IMAGE
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              -p 8181:8181 \
              --restart unless-stopped \
              $IMAGE
            docker image prune -f
